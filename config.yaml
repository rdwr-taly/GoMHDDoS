# GoMHDDoS Container Control Configuration v2.0
# Uses Container Control Core v2.0 with optional services

# --- Adapter Configuration (Required) ---
adapter:
  class: gomhddos_adapter.GoMHDDoSAdapter  # dotted-path to our GoMHDDoS adapter
  primary_payload_key: method              # attack method is required in /api/start body
  run_as_user: appuser                     # run attacks as non-root user

# --- Core Process Management (Enabled) ---
# Let the core handle starting and stopping the GoMHDDoS process
process_management:
  enabled: true
  # Use the adapter's command factory method to build the attack command
  command_factory: "gomhddos_adapter.GoMHDDoSAdapter.build_attack_command"

# --- Core Metrics Service (Enabled) ---
# Automatic collection of network and process metrics
metrics:
  network_monitoring:
    enabled: true
    interface: "eth0"
  process_monitoring:
    enabled: true

# --- Core Traffic Control (Enabled) ---
# Let the core manage network shaping using 'tc'
traffic_control:
  enabled: true
  interface: "eth0"
  bandwidth_mbps_key: "bandwidth_limit_mbps"
  default_bandwidth_mbps: 10
  latency_ms_key: "latency_ms"
  default_latency_ms: 0

# --- Privileged Commands (Optional) ---
# System tuning for high-performance attacks
privileged_commands:
  pre_start:
    # Increase network connection limits for high-throughput attacks
    - ["sysctl", "-w", "net.core.somaxconn=4096"]
    - ["sysctl", "-w", "net.core.netdev_max_backlog=5000"]
    - ["sysctl", "-w", "net.ipv4.tcp_max_syn_backlog=4096"]
  post_stop:
    # Clean up any firewall rules (if needed)
    - ["iptables", "-F", "OUTPUT", "2>/dev/null", "||", "true"]
